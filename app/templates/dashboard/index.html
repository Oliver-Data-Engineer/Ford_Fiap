<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — {{ marca }} {{ modelo }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard/style.css') }}">
</head>
<body>

  <main class="dashboard">
    <header class="dashboard__cabecalho">
      <a href="{{ url_for('busca') }}" class="dashboard__voltar">&larr; Voltar para a busca</a>
      <h1>Dashboard</h1>
      <p>Resultado para o veículo selecionado.</p>
    </header>

    <section class="dashboard__resumo" id="resumo"
      data-marca="{{ marca }}"
      data-modelo="{{ modelo }}"
      data-versao="{{ versao }}">
      <div class="resumo__item">
        <span class="resumo__rotulo">Marca</span>
        <span class="resumo__valor">{{ marca }}</span>
      </div>
      <div class="resumo__item">
        <span class="resumo__rotulo">Modelo</span>
        <span class="resumo__valor">{{ modelo }}</span>
      </div>
      <div class="resumo__item">
        <span class="resumo__rotulo">Versão</span>
        <span class="resumo__valor">{{ versao }}</span>
      </div>
    </section>

    <section class="dashboard__conteudo">
      <p>Dashboard em construção — aqui vão entrar os dados e gráficos do veículo selecionado.</p>
    </section>
  </main>

  <script src="{{ url_for('static', filename='dashboard/script.js') }}"></script>
</body> 
</html>
