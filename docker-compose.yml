x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

services:
  fastapi:
    build: *app-build
    image: ford_fiap:latest
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Sobrescreve o valor do .env (caminho Windows, não resolve dentro do
      # container) — mesmo arquivo, montado abaixo em /app/config.
      - GOOGLE_APPLICATION_CREDENTIALS=/app/config/ford-493401-a1052494205f.json
    volumes:
      - ./data:/app/data
      - ./airflow/dags:/app/airflow/dags
      - ./config:/app/config:ro
    restart: unless-stopped

  flask:
    build: *app-build
    image: ford_fiap:latest
    command: python app/app.py
    ports:
      - "5000:5000"
    environment:
      - FASTAPI_BASE_URL=http://fastapi:8000
    env_file:
      - .env
    depends_on:
      - fastapi
    restart: unless-stopped
